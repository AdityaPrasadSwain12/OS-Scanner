name: scanner-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: ruff check .
      - run: mypy app
      - run: pytest --cov=app --cov-report=term-missing
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python packaging/generate_manifest.py dist --output dist/manifest.json
      - run: python packaging/verify_manifest.py dist dist/manifest.json
