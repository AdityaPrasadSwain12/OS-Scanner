environment: production
data_directory: /var/lib/endpoint-scanner
log_level: INFO

runtime:
  max_concurrency: 4
  subprocess_timeout_seconds: 60
  scan_timeout_seconds: 1800
  max_tool_output_bytes: 10485760
  max_inventory_records: 250000
  max_policy_operations: 5000000

retention:
  retention_days: 90
  report_retention_days: 30
  succeeded_upload_retention_days: 7
  max_completed_scans: 10000
  max_report_files: 10000
  maintenance_batch_size: 1000
  max_local_storage_bytes: 5368709120
  minimum_free_disk_bytes: 536870912
  legal_hold_scan_ids: [] # Locally protected evidence; centralize holds in managed config.

policies:
  directory: /etc/endpoint-scanner/policies
  allow_symlinks: false

cloud:
  base_url: https://security-platform.example.com/endpoint-control
  # The endpoint uploads evidence/SBOM; OSV-Scanner and dep-scan run in cloud workers.
  offload_vulnerability_analysis: true
  connect_timeout_seconds: 5
  read_timeout_seconds: 30
  max_response_bytes: 8388608
  max_request_bytes: 33554432
  max_retries: 5
  tls_verify: true
  ca_bundle: null
  routes:
    enrollment_path: /api/v1/endpoint/enroll
    credential_rotation_path_template: /api/v1/endpoints/{endpoint_id}/credentials/rotate
    scan_submit_path: /api/v1/scans
    scan_status_path: /api/v1/scans/status
    scan_lookup_path_template: /api/v1/scans/{scan_id}
    next_scan_path_template: /api/v1/scans/next/{endpoint_id}
    policies_path: /api/v1/policies
    heartbeat_path: /api/v1/heartbeat
    attack_surface_jobs_path: /api/v1/attack-surface/jobs
    scan_rejections_path: /api/v1/scans/rejections

discovery:
  enabled: false
  passive_only: true
  authorized_domains: [] # Required when enabled; customer-owned DNS roots only.
  max_dns_concurrency: 1
  max_dns_queries_per_second: 1

scheduling:
  # Cloud-managed deployments receive authorized jobs from the control plane.
  enabled: false
  startup_scan: false
  periodic_interval_seconds: null
  jitter_ratio: 0.10
  scan_type: QUICK
  timeout_seconds: 900
  approved_sources: [] # Required for scheduled VULNERABILITY scans.
  authorization_scope_id: local-scheduler
  authorization_reference: protected-enterprise-service-configuration

tools:
  # Core endpoint scans use native OS commands and need none of these tools.
  # Configure a protected absolute path only for an optional adapter you enable.
  osquery_executable: null
  osv_scanner_executable: null
  depscan_executable: null
  approved_dependency_roots: []
  openscap_executable: null
  approved_scap_content_roots: []
  default_scap_content: null
  default_scap_profile: null
  amass_executable: null

analysis:
  enforce_administrator_allowlist: false
  enforce_port_allowlist: false
  maximum_administrator_accounts: 4
  enforce_os_support_catalog: false
  supported_os_releases: [] # Example: ["WINDOWS:10.0.26100", "MACOS:15.6"]
  required_security_agent_names: []
  required_security_service_names: []
  approved_security_posture: {} # Example: {firewall_enabled: true, secure_boot_enabled: true}

# Credentials are provisioned by enrollment and stored outside this file.
